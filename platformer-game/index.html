<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixeLab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101418; color: #e8eef4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 12px 24px; }
  h1 { margin: 0 0 10px; font-size: 22px; }
  .stage { position: relative; background: #000; border: 1px solid #2c3947; border-radius: 8px; overflow: hidden; }
  #game { width: 100%; aspect-ratio: 16 / 9; }
  #game canvas { display: block; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.55); text-align: center; padding: 16px; z-index: 2; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; line-height: 1.6; color: #cbd6e2; }
  .touch { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 10px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); }
  .dpad button { width: 36px; height: 36px; font-size: 14px; border: 1px solid #0b0f14; border-radius: 4px; background: #222f3e; color: #e8eef4; touch-action: none; }
  .dpad button:disabled { opacity: 0.35; }
  .dpad .center { background: #222f3e; }
  .dpad .empty { background: transparent; }
  .mid { display: flex; gap: 8px; }
  .mid button { padding: 8px 10px; border-radius: 999px; background: #3a4a5a; color: #fff; border: 1px solid #222; font-size: 12px; touch-action: none; }
  .ab { display: flex; gap: 14px; align-items: flex-end; }
  .ab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #cbd6e2; }
  .ab-btn button { width: 56px; height: 56px; border-radius: 50%; background: #c81e1e; border: 2px solid #7f1d1d; color: #fff; font-weight: 700; font-size: 18px; touch-action: none; }
  .hint { margin-top: 10px; font-size: 12px; color: #8b95a9; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PixeLab</h1>
  <div class="stage">
    <div id="game"></div>
    <div class="overlay hidden" id="pauseOverlay">
      <h2>Tạm dừng</h2>
      <p>Bấm P hoặc nút Dừng để tiếp tục.</p>
    </div>
  </div>
  <div class="touch">
    <div class="dpad">
      <span class="empty"></span>
      <button type="button" data-k="jump">▲</button>
      <span class="empty"></span>
      <button type="button" data-k="left">◀</button>
      <span class="center"></span>
      <button type="button" data-k="right">▶</button>
      <span class="empty"></span>
      <button type="button" disabled>▼</button>
      <span class="empty"></span>
    </div>
    <div class="mid">
      <button type="button" id="pauseBtn">Dừng</button>
      <button type="button" data-k="run">Chạy</button>
    </div>
    <div class="ab">
      <div class="ab-btn"><button type="button" data-k="jump">B</button><span>Nhảy</span></div>
      <div class="ab-btn"><button type="button" data-k="attack">A</button><span>Chém</span></div>
    </div>
  </div>
  <p class="hint">Phím: A/D hoặc ←/→ di chuyển, giữ Shift/X chạy, Z/Space/↑ nhảy, J chém (cả khi nhảy), P tạm dừng, R chơi lại.</p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
