<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixeLab</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101418; color: #e8eef4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px 12px 24px; }
  h1 { margin: 0 0 10px; font-size: 22px; }
  .hud { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: #1b232c; border: 1px solid #2c3947; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
  .hud .lv { font-weight: 700; }
  .bar { display: flex; align-items: center; gap: 6px; }
  .bar .track { width: 140px; height: 12px; background: #0d1319; border: 1px solid #3a4a5a; border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; }
  .bar.hp .fill { background: #e5484d; width: 100%; }
  .bar.mp .fill { background: #3b82f6; width: 100%; }
  .bar.exp .fill { background: #f5c518; width: 0%; }
  .stage { position: relative; background: #000; border: 1px solid #2c3947; border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.55); text-align: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; line-height: 1.6; color: #cbd6e2; }
  .overlay button { margin-top: 6px; padding: 8px 18px; font-size: 15px; border: 0; border-radius: 6px; background: #f5c518; color: #111; cursor: pointer; }
  .touch { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 10px; }
  /* Tay NES: D-pad chữ thập bên trái, 2 nút tròn đỏ A/B bên phải, 2 nút dẹt ở giữa */
  .dpad { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); }
  .dpad button { width: 36px; height: 36px; font-size: 14px; border: 1px solid #0b0f14; border-radius: 4px; background: #222f3e; color: #e8eef4; touch-action: none; }
  .dpad button:disabled { opacity: 0.35; }
  .dpad .center { background: #222f3e; }
  .dpad .empty { background: transparent; }
  .mid { display: flex; gap: 8px; }
  .mid button { padding: 8px 10px; border-radius: 999px; background: #3a4a5a; color: #fff; border: 1px solid #222; font-size: 12px; touch-action: none; }
  .ab { display: flex; gap: 14px; align-items: flex-end; }
  .ab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #cbd6e2; }
  .ab-btn button { width: 56px; height: 56px; border-radius: 50%; background: #c81e1e; border: 2px solid #7f1d1d; color: #fff; font-weight: 700; font-size: 18px; touch-action: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PixeLab</h1>
  <div class="hud">
    <span class="lv">Lv 1</span>
    <span class="bar hp">HP <span class="track"><span class="fill"></span></span> 100/100</span>
    <span class="bar mp">MP <span class="track"><span class="fill"></span></span> 50/50</span>
    <span class="bar exp">EXP <span class="track"><span class="fill"></span></span> 0/100</span>
  </div>
  <div class="stage">
    <canvas id="game" width="480" height="270"></canvas>
    <div class="overlay" id="startOverlay">
      <h2>Bắt đầu</h2>
      <p>Di chuyển: A/D hoặc ←/→ &nbsp;•&nbsp; Chạy: giữ Shift/X<br>
      Nhảy: Z / Space / ↑ &nbsp;•&nbsp; Chém: J &nbsp;•&nbsp; Dừng: P &nbsp;•&nbsp; Chơi lại: R &nbsp;•&nbsp; Tiếng: M</p>
      <button id="startBtn" type="button">Chơi</button>
    </div>
    <div class="overlay hidden" id="pauseOverlay">
      <h2>Tạm dừng</h2>
      <p>Bấm P để tiếp tục.</p>
    </div>
  </div>
  <div class="touch">
    <div class="dpad">
      <span class="empty"></span>
      <button type="button" data-k="jump">▲</button>
      <span class="empty"></span>
      <button type="button" data-k="left">◀</button>
      <span class="center"></span>
      <button type="button" data-k="right">▶</button>
      <span class="empty"></span>
      <button type="button" disabled>▼</button>
      <span class="empty"></span>
    </div>
    <div class="mid">
      <button type="button" id="pauseBtn">Dừng</button>
      <button type="button" data-k="run">Chạy</button>
    </div>
    <div class="ab">
      <div class="ab-btn"><button type="button" data-k="jump">B</button><span>Nhảy</span></div>
      <div class="ab-btn"><button type="button" data-k="attack">A</button><span>Chém</span></div>
    </div>
  </div>
</div>

// Đòn chém = combo_1 (3 frame, vệt kiếm lớn) nối tiếp combo_1_end (4 frame thu kiếm).
var ATTACK_FRAMES = [ ["combo", 0], ["combo", 1], ["combo", 2],
                      ["comboEnd", 0], ["comboEnd", 1], ["comboEnd", 2], ["comboEnd", 3] ];

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var startOverlay = document.getElementById("startOverlay");
var pauseOverlay = document.getElementById("pauseOverlay");

var keys = {};
var player = null;
var camX = 0, started = false, paused = false, muted = false;
var particles = [];
var last = 0;

function reset() {
  player = {
    x: 60, y: GROUND_Y - 32, w: 15, h: 32, // hitbox: rộng 15, cao 32 (thu đúng nửa từ 30x64 theo SCALE=1), chân tại GROUND_Y
    vx: 0, vy: 0, face: 1, grounded: true,
    state: "idle", animT: 0, airT: 0, fallT: 0,
    attacking: false, attackT: 0, attackHitDone: false
  };
  camX = 0; particles = [];
}
reset();

// --- Âm thanh tối giản (chỉ tiếng nhảy + chém, không nhạc nền) ---
var AC = null;
function sfx(kind) {
  if (muted || !started) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (kind === "jump") { o.type = "sine"; o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.15); }
    else { o.type = "sawtooth"; o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(200, t + 0.12); }
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.start(t); o.stop(t + 0.17);
  } catch (e) { /* bỏ qua nếu trình duyệt chặn audio */ }
}

function isDown(k) { return !!keys[k]; }
function attackBox() {
  // Vùng chém trước mặt, để sẵn cho bước thêm địch sau (hiện chưa có mục tiêu).
  var w = 35, h = 25;
  return player.face > 0
    ? { x: player.x + player.w, y: player.y + 2, w: w, h: h }
    : { x: player.x - w, y: player.y + 2, w: w, h: h };
}
function startAttack() {
  if (player.attacking || !player.grounded) return;
  player.attacking = true; player.attackT = 0; player.attackHitDone = false;
  player.vx = 0; sfx("slash");
}
function update(dt) {
  var p = player, speed = 0, moving = false;
  if (p.attacking) {
    p.attackT += dt;
    if (p.attackT >= ATTACK_FRAMES.length * 0.06) { p.attacking = false; p.attackT = 0; }
    // Đòn chém khóa di chuyển, vẫn chịu trọng lực nếu đang ở trên không (không xảy ra ở bước này).
  } else {
    var run = isDown("run");
    if (isDown("left")) { speed = -(run ? 90 : 50); p.face = -1; moving = true; }
    else if (isDown("right")) { speed = (run ? 90 : 50); p.face = 1; moving = true; }
    p.vx = speed;
    if (isDown("jump") && p.grounded) {
      p.vy = -260; p.grounded = false; p.airT = 0; p.fallT = 0; sfx("jump");
    }
    if (isDown("attack")) startAttack();
  }
  if (!p.grounded) {
    p.vy += 700 * dt;
    p.airT += dt;
    if (p.vy > 0) p.fallT += dt;
  }
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.x < 0) p.x = 0;
  if (p.x > WORLD_W - p.w) p.x = WORLD_W - p.w;
  if (p.y + p.h >= GROUND_Y) {
    if (!p.grounded) {
      for (var i = 0; i < 5; i++) particles.push({ x: p.x + p.w / 2, y: GROUND_Y, vx: (Math.random() - 0.5) * 40, vy: -Math.random() * 30, t: 0 });
    }
    p.y = GROUND_Y - p.h; p.vy = 0; p.grounded = true; p.airT = 0; p.fallT = 0;
  }
  // Trạng thái animation
  if (p.attacking) p.state = "attack";
  else if (!p.grounded) p.state = p.vy < 0 ? "jump" : "fall";
  else if (moving) p.state = isDown("run") ? "run" : "walk";
  else p.state = "idle";
  p.animT += dt;
  for (var j = particles.length - 1; j >= 0; j--) {
    var pt = particles[j]; pt.t += dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    if (pt.t > 0.4) particles.splice(j, 1);
  }
  // Camera bám theo nhân vật, kẹp trong thế giới
  var target = p.x + p.w / 2 - VIEW_W / 2;
  if (target < 0) target = 0;
  if (target > WORLD_W - VIEW_W) target = WORLD_W - VIEW_W;
  camX = target;
}
function currentFrame() {
  var p = player;
  if (p.state === "attack") {
    var idx = Math.floor(p.attackT / 0.06);
    if (idx >= ATTACK_FRAMES.length) idx = ATTACK_FRAMES.length - 1;
    return ATTACK_FRAMES[idx];
  }
  if (p.state === "jump") return p.airT < 0.08 ? ["jump", 0] : ["jump", 2];
  if (p.state === "fall") {
    if (p.fallT < 0.24) return ["fall", Math.floor(p.fallT / 0.06)];
    return ["fallLoop", Math.floor((p.fallT - 0.24) / 0.1) % 3];
  }
  if (p.state === "walk") return ["walk", Math.floor(p.animT / 0.09) % 10];
  if (p.state === "run") return ["run", Math.floor(p.animT / 0.07) % 10];
  return ["idle", Math.floor(p.animT / 0.12) % 10];
}
function drawBackground() {
  var g = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  g.addColorStop(0, "#79c4f2"); g.addColorStop(1, "#d9f2ff");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.fillStyle = "#ffd94d";
  ctx.beginPath(); ctx.arc(400 - camX * 0.05, 40, 18, 0, 6.3); ctx.fill();
  // Núi xa (parallax 0.3)
  ctx.fillStyle = "#7fa8c9";
  for (var i = 0; i < 8; i++) {
    var mx = i * 320 - camX * 0.3;
    ctx.beginPath(); ctx.moveTo(mx, GROUND_Y); ctx.lineTo(mx + 110, GROUND_Y - 90); ctx.lineTo(mx + 220, GROUND_Y); ctx.closePath(); ctx.fill();
  }
  // Cây gần (parallax 0.6)
  for (var k = 0; k < 12; k++) {
    var tx = k * 200 + 80 - camX * 0.6;
    if (tx < -40 || tx > VIEW_W + 40) continue;
    ctx.fillStyle = "#6b4a2f"; ctx.fillRect(tx + 8, GROUND_Y - 42, 6, 42);
    ctx.fillStyle = "#2f7d4f";
    ctx.beginPath(); ctx.arc(tx + 11, GROUND_Y - 52, 20, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(tx - 2, GROUND_Y - 40, 13, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(tx + 24, GROUND_Y - 40, 13, 0, 6.3); ctx.fill();
  }
  // Mặt đất: cỏ + đất, dài theo thế giới
  ctx.fillStyle = "#4caf50"; ctx.fillRect(0, GROUND_Y, VIEW_W, 8);
  ctx.fillStyle = "#8b5a2b"; ctx.fillRect(0, GROUND_Y + 8, VIEW_W, VIEW_H - GROUND_Y - 8);
  ctx.fillStyle = "#6d4520";
  for (var s = 0; s < 40; s++) {
    var sx = ((s * 173) % WORLD_W) - camX;
    if (sx >= 0 && sx < VIEW_W) ctx.fillRect(sx, GROUND_Y + 18 + ((s * 37) % 28), 10, 4);
  }
  ctx.fillStyle = "#3e8e41";
  for (var t2 = 0; t2 < 30; t2++) {
    var gx = ((t2 * 211 + 50) % WORLD_W) - camX;
    if (gx >= 0 && gx < VIEW_W) { ctx.fillRect(gx, GROUND_Y - 3, 2, 4); ctx.fillRect(gx + 3, GROUND_Y - 2, 2, 3); }
  }
}
function drawPlayer() {
  var p = player, f = currentFrame(), sh = SHEETS[f[0]];

  ctx.save();

  ctx.restore();
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (var i = 0; i < particles.length; i++) {
    var pt = particles[i];
    ctx.fillRect(pt.x - camX, pt.y - pt.t * 20, 2, 2);
  }
}
function draw() {
  drawBackground();
  drawPlayer();
}
function loop(ts) {
  requestAnimationFrame(loop);
  if (!started || paused) return;
  if (!last) last = ts;
  var dt = (ts - last) / 1000; last = ts;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
}
function startGame() {
  started = true; paused = false; last = 0;
  startOverlay.classList.add("hidden"); pauseOverlay.classList.add("hidden");
}
document.getElementById("startBtn").addEventListener("click", startGame);
var KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  ShiftLeft: "run", ShiftRight: "run", KeyX: "run",
  KeyZ: "jump", Space: "jump", ArrowUp: "jump", KeyJ: "attack" };
window.addEventListener("keydown", function (e) {
  if (e.code === "KeyP" && started) { paused = !paused; pauseOverlay.classList.toggle("hidden", !paused); return; }
  if (e.code === "KeyR") { reset(); return; }
  if (e.code === "KeyM") { muted = !muted; return; }
  var k = KEYMAP[e.code];
  if (k) { keys[k] = true; if (e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault(); }
});
window.addEventListener("keyup", function (e) {
  var k = KEYMAP[e.code]; if (k) keys[k] = false;
});
document.getElementById("pauseBtn").addEventListener("click", function () {
  if (!started) return;
  paused = !paused; pauseOverlay.classList.toggle("hidden", !paused);
});
document.querySelectorAll(".touch button").forEach(function (b) {
  var k = b.getAttribute("data-k");
  if (!k) return;
  function on(e) { e.preventDefault(); keys[k] = true; }
  function off(e) { e.preventDefault(); keys[k] = false; }
  b.addEventListener("pointerdown", on);
  b.addEventListener("pointerup", off);
  b.addEventListener("pointerleave", off);
  b.addEventListener("pointercancel", off);
});
requestAnimationFrame(loop);
</script>
</body>
