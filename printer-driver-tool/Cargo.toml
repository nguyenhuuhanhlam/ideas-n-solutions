[package]
name = "printer-driver-tool"
version = "0.2.0"
edition = "2021"
description = "Windows 11 CLI: list installed printer drivers, show details, export and back up driver files"
license = "MIT"

[lib]
name = "printer_driver_tool"
path = "src/lib.rs"

[[bin]]
name = "printer-driver-tool"
path = "src/main.rs"

[dependencies]
# Không có dependency ngoài Windows: JSON/CSV/bảng tự viết tay,
# CLI tự parse (theo triết lý nhẹ của file-watcher).

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System_Console",
] }

[profile.release]
# Nhẹ + nhanh: tối ưu tốc độ, link-time optimization toàn bộ,
# 1 codegen unit, strip symbol, không unwind khi panic.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
