[package]
name = "clipboard-tool"
version = "0.1.0"
edition = "2021"
description = "Windows tray clipboard tool: plain-text only, RAM only, decoupled Rust modules"
license = "MIT"

[lib]
name = "clipboard_tool"
path = "src/lib.rs"

[[bin]]
name = "clipboard-tool"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
eframe = "0.31"
egui = "0.31"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
